mnew:i=>M(`<h2>Affecter le transport</h2><div class="mu">${pn(PARC[+i].p)} · ${PARC[+i].n} · ~${f(vl(PARC[+i]))} t</div><label>Transport<select id="mv">${FLT.map((v,k)=>`<option value="${k}">Interne · ${v.im} · ${v.n} (${v.cap} t)</option>`).join("")}<option value="-1">Producteur (véhicule propre)</option></select></label><label>Immatriculation du véhicule du producteur<input id="mpl" placeholder="si transport producteur"></label><div class="row"><button class="b" data-a="msv" data-v="${i}">Affecter</button><button class="b s" data-a="mc">Annuler</button></div>`),
msv:i=>{MIS.push({pc:+i,v:+$("#mv").value,pl:$("#mpl").value});log("Transport affecté : "+pn(PARC[+i].p));toast("Mission créée");M("");render()},
mdl:i=>{if(!DLM.includes(+i))DLM.push(+i);try{localStorage.setItem("pfdl",JSON.stringify(DLM))}catch(e){}toast("Feuille de route et carte enregistrées hors-ligne");render()},
mrt:i=>{const m=MIS[+i],x=PARC[m.pc],c=cenP(pp(x)),d=dstK(USN,c);M(`<h2>${pn(x.p)} · ${x.n}</h2>${mapSv(x)}<div class="sm"><b>${d.toFixed(0)} km</b> · environ ${Math.round(d/38*60)} min · GPS ${c[0].toFixed(5)}, ${c[1].toFixed(5)}</div><div class="sm mu">Vert : axe goudronné. Rouge pointillé : piste jusqu'au champ, d'après le contour tracé par l'Agt/S-T. Départ de l'usine, 2 points de passage, arrivée à la parcelle.</div><button class="b s" data-a="mc">Fermer</button>`,1)},
psave:()=>{const c=pesCalc();if(c.kg<=0||c.ta<0||c.ta>=c.kg)return toast("Le poids brut doit dépasser la tare.");if(c.a)c.a.rb+=c.ret;P[c.i][5]+=c.net/1000;tot.l+=c.net/1000;G.find(g=>g[0]===P[c.i][1])[3]+=c.net/1000;const ms=MIS.find(m=>PARC[m.pc].p===c.i&&!m.done);if(ms)ms.done=1;const pc=PARC.find(x=>x.p===c.i&&!x.liv&&x.tif&&mat(x)>=100);if(pc)pc.liv=1;const tk="TK-"+String(W.length+1).padStart(4,"0");W.unshift({tk,h:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),p:c.i,kg:c.kg,ta:c.ta,rf:c.rf,net:c.net,ret:c.ret,ex:c.ex,ve:c.ve});log(`Pesée ${tk} : ${P[c.i][0]}, ${f(c.net)} kg nets`);PAY.unshift({tk,p:c.i,mt:Math.max(0,c.net*100-c.ret-c.ex),st:0,mode:""});render();X.tkt(0)},
tkt:k=>{const w=W[+k],pr=P[w.p],pay=w.net*100-(w.ret||0)-(w.ex||0);M(`<div id="tkt" style="display:grid;gap:8px"><h2>Ticket de pesée ${w.tk}</h2><div class="sm mu">PromoFruits Bénin · pont-bascule · ${new Date().toLocaleDateString("fr-FR")} ${w.h}</div><table style="min-width:0"><tbody>${[["Producteur",pr[0]+" · "+pr[1]],["Véhicule",w.ve||"—"],["Poids brut",f(w.kg)+" kg"],["Poids à vide (tare)",f(w.ta||0)+" kg"],["Poids net (brut − tare)",f(w.kg-(w.ta||0))+" kg"],["Refus qualité",w.rf+" %"],["Net accepté",f(w.net)+" kg"],["Retenue avance",f(w.ret||0)+" F"],["Autres retenues",f(w.ex||0)+" F"],["Net à payer (100 F/kg)",f(pay)+" F"]].map(r=>`<tr><td class="mu">${r[0]}</td><td class="r"><b>${r[1]}</b></td></tr>`).join("")}</tbody></table></div><div class="row"><button class="b" data-a="prt">Imprimer</button><button class="b s" data-a="mc">Fermer</button></div>`)},
prt:()=>window.print()});

Object.assign(X,{
rel:i=>{const x=PARC[+i];log("Relance SMS · "+pn(x.p));toast("SMS de relance envoyé à "+pn(x.p))},
mnew:i=>{const x=PARC[+i],h=hvD(x),t=new Date();t.setHours(12,0,0,0);M(`<h2>Affecter une livraison</h2><div class="mu">${pn(x.p)} · ${x.n} · ~${f(vl(x))} t</div><label>Date de livraison<input id="md2" type="date" value="${isoD(h&&h>t?h:t)}"></label><label>Créneau au pont-bascule<select id="ms2">${SL.map((l,k)=>`<option value="${k}">${l}</option>`).join("")}</select></label><label>Transport<select id="mv">${FLT.map((v,k)=>`<option value="${k}">Interne · ${v.im} · ${v.n} (${v.cap} t)</option>`).join("")}<option value="-1">Producteur (véhicule propre)</option></select></label><label>Immatriculation du véhicule du producteur<input id="mpl" placeholder="si transport producteur"></label><div class="row"><button class="b" data-a="msv" data-v="${i}">Affecter</button><button class="b s" data-a="mc">Annuler</button></div>`)},
msv:i=>{const d=$("#md2").value,q2=+$("#ms2").value;if(!d)return toast("Choisissez la date.");MIS.push({pc:+i,v:+$("#mv").value,pl:$("#mpl").value,d,s:q2,done:0});const n=ld(d,q2).length;log(`Livraison affectée · ${pn(PARC[+i].p)} · ${d} ${SL[q2]}`);toast(n>CAPB?`Attention : ${n} camions sur ce créneau (capacité ${CAPB})`:"Livraison planifiée");M("");render()},
mslot:v=>{const[d,q2]=v.split(","),L=MIS.map((m,i)=>[m,i]).filter(([m])=>m.d===d&&m.s===+q2&&!m.done);M(`<h2>${fdt(pd(d))} · ${SL[+q2]}</h2><div class="mu">${L.length} camion(s) pour ${CAPB} au pont-bascule</div>${L.map(([m,i])=>`<div class="c row" style="justify-content:space-between"><div><b>${pn(PARC[m.pc].p)}</b> · ${PARC[m.pc].n}<div class="sm mu">${m.v>=0?FLT[m.v].im:m.pl||"véhicule producteur"} · ~${f(vl(PARC[m.pc]))} t</div></div>${can("plan")?`<button class="b s z" data-a="mmv" data-v="${i}">Reporter</button>`:""}</div>`).join("")||'<div class="mu">Créneau libre.</div>'}<button class="b s" data-a="mc">Fermer</button>`)},
mmv:i=>{const m=MIS[+i],ok=mvTo(m);M("");toast(ok?`Reporté au ${fdt(pd(m.d))} · ${SL[m.s]}`:"Aucun créneau libre");log("Livraison reportée · "+pn(PARC[m.pc].p));render()},
rbal:v=>{const[d,q2]=v.split(","),L=MIS.filter(m=>m.d===d&&m.s===+q2&&!m.done);let n=0;while(L.length>CAPB){if(!mvTo(L.pop()))break;n++}log(`Excédent reporté : ${n} camion(s)`);toast(n+" camion(s) reporté(s) sur des créneaux libres");render()},
yact:i=>{const p=PAY[+i],a=ACTP[p.st];if(!a||a[0]!==role)return;if(p.st===2)return M(`<h2>Payer ${pn(p.p)}</h2><div class="mu">${p.tk} · <b>${f(p.mt)} F</b></div><label>Mode de paiement<select id="ym"><option>Mobile Money</option><option>Espèces</option><option>Virement</option></select></label><div class="row"><button class="b" data-a="ypay" data-v="${i}">Confirmer le paiement</button><button class="b s" data-a="mc">Annuler</button></div>`);p.st++;log(`${p.tk} · ${PAYST[p.st]}`);toast("Ticket : "+PAYST[p.st].toLowerCase());render()},
ypay:i=>{const p=PAY[+i];p.mode=$("#ym").value;p.st=3;log(`${p.tk} payé à ${pn(p.p)} (${f(p.mt)} F, ${p.mode})`);toast("Paiement effectué · SMS de confirmation au producteur");M("");render()},
yrc:i=>{const p=PAY[+i];M(`<div id="tkt" style="display:grid;gap:8px"><h2>Reçu de paiement</h2><div class="sm mu">PromoFruits Bénin · ${p.tk}</div><table style="min-width:0"><tbody><tr><td class="mu">Producteur</td><td class="r"><b>${P[p.p][0]}</b></td></tr><tr><td class="mu">Groupement</td><td class="r">${P[p.p][1]}</td></tr><tr><td class="mu">Montant payé</td><td class="r"><b>${f(p.mt)} F</b></td></tr><tr><td class="mu">Mode</td><td class="r">${p.mode}</td></tr></tbody></table></div><div class="row"><button class="b" data-a="prt">Imprimer</button><button class="b s" data-a="mc">Fermer</button></div>`)}});
const mvTo=m=>{let d=pd(m.d),q2=m.s;for(let k=0;k<36;k++){q2++;if(q2>2){q2=0;d=new Date(+d+864e5);if(dow(d)===6)d=new Date(+d+864e5)}if(ld(isoD(d),q2).length<CAPB){m.d=isoD(d);m.s=q2;return 1}}return 0};
const _psv=X.psv;X.psv=(v,t,e)=>{const n=P.length;_psv(v,t,e);if(P.length>n){const i=P.length-1;PARC.push({p:i,n:"Champ A",ha:P[i][6],gps:[6.7+i*.01,2.2],pts:[],ph:0,tif:null,pr:null,vis:[],liv:0});render()}};
const _go=X.go;X.go=v=>{sbo=0;_go(v)};
pv=function(){const c=pesCalc();$("#pv").innerHTML=`Net (brut − tare) : <b>${f(c.n0)} kg</b> · après refus : <b>${f(c.net)} kg</b> · retenue avance : <b>${c.a?f(c.ret)+" F":"aucune"}</b> · net à payer : <b>${f(c.val-c.ret-c.ex)} F</b>`};
const _rd=render;render=function(){_rd();$("#sb").className="sb"+(sbc?" cl":"")+(sbo?" open":"");$("#top").insertAdjacentHTML("afterbegin",'<button class="b s z" data-a="sbt" aria-label="Plier ou déplier le menu">☰</button>')};
document.addEventListener("change",e=>{const t=e.target;if(t.id==="py"){py=t.value;render()}if(t.id==="ag"){ag=+t.value;render()}if(t.id==="dv"){drv=+t.value;render()}if(t.id==="trph"&&t.files[0]){const r=new FileReader();r.onload=()=>{TRC.ph=r.result;trM()};r.readAsDataURL(t.files[0])}});

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&X[t.dataset.a])X[t.dataset.a](t.dataset.v,t,e)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr[data-a]"))e.target.click();if(e.key==="Escape"){M("");if(dp!==null){dp=null;render()}}});
document.addEventListener("input",e=>{const id=e.target.id||"";if(id==="q"){q=e.target.value;$("#tb").innerHTML=ptb()}if(["pk","pr","pp","pt","px","pe"].includes(id))pv()});
document.addEventListener("change",e=>{if(e.target.id==="rl"){role=e.target.value;view=R[role][2];dp=null;M("");render()}if(e.target.id==="pf"){pf=e.target.value;render()}});
render();
</script>
